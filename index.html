<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas Steam Ucrania</title>
<link rel="stylesheet" href="assets/style.css">
<style>[hidden]{display:none!important}#mas{display:block;margin:1.5rem auto;padding:.8rem 2rem;cursor:pointer}.equivalente-eur{font-size:.9em}</style>
</head>
<body>
<header><h1>Ofertas Steam Ucrania</h1><p id="fecha"></p></header>
<main>
<section class="filtros">
<input id="busqueda" type="search" placeholder="Buscar juego..." aria-label="Buscar juego">
<select id="region" aria-label="Región"><option value="ua">Ucrania (UAH)</option></select>
<select id="tipo" aria-label="Tipo de producto"><option value="">Todos los tipos disponibles</option><option value="game">Juegos</option></select>
<select id="orden" aria-label="Ordenar"><option value="descuento">Mayor descuento</option><option value="precio">Precio más bajo</option><option value="nombre">Nombre A-Z</option></select>
<span>Descuento mínimo: 50 %</span>
</section>
<p id="aviso" class="aviso">Precios nativos de Steam Ucrania. Solo juegos con descuento de al menos el 50 %.</p>
<p id="contador" role="status"></p>
<section id="resultados" class="grid"></section>
<p id="vacio" hidden>No hay ofertas que coincidan.</p>
<button id="mas" type="button" hidden>Ver más</button>
</main>
<footer><p>Fuente de precios: Steam Store. Conversión EUR orientativa: Banco Nacional de Ucrania.</p><p id="cambio"></p></footer>
<script src="assets/app.js"></script>
</body></html>
