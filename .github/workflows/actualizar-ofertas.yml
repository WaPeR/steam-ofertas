name: Actualizar ofertas Steam

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar ofertas por región
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python scripts/actualizar_ofertas.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualizar ofertas diarias por región"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar en GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Desplegar GitHub Pages
        uses: actions/deploy-pages@v4
