name: Actualizar ofertas Steam

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/actualizar_ofertas.py
      - assets/app.js
      - index.html
      - .github/workflows/actualizar-ofertas.yml

concurrency:
  group: actualizar-ofertas-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4
      - name: Obtener ofertas nativas por país
        id: generar
        continue-on-error: true
        run: python scripts/actualizar_ofertas.py
      - name: Guardar países completados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Actualizar ofertas Steam por país"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - uses: actions/deploy-pages@v4
      - name: Señalar errores sin perder países guardados
        if: steps.generar.outcome == 'failure'
        run: |
          echo "La descarga falló para algún país. Se conservaron los datos anteriores de ese país."
          exit 1
