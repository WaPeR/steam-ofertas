name: Actualizar ofertas Steam

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      solo_publicar:
        description: Publicar los datos guardados sin consultar Steam
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - scripts/actualizar_ofertas.py
      - assets/app.js
      - index.html
      - .github/workflows/actualizar-ofertas.yml

concurrency:
  group: actualizar-ofertas-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pages: read
    env:
      DESCARGAR: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.solo_publicar) }}
    outputs:
      resultado_descarga: ${{ steps.generar.outcome }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        if: env.DESCARGAR == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        if: env.DESCARGAR == 'true'
        run: pip install requests beautifulsoup4
      - name: Obtener ofertas nativas por país
        if: env.DESCARGAR == 'true'
        id: generar
        continue-on-error: true
        run: python scripts/actualizar_ofertas.py
      - name: Guardar países completados
        if: env.DESCARGAR == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Actualizar ofertas Steam por país"
          git push
      - name: Preparar solo archivos públicos
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -R assets _site/
          cp data/ofertas-ua.json _site/data/
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir paquete de la web
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  desplegar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Desplegar el paquete ya subido
        id: publicar
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
      - name: Señalar errores de descarga sin perder los países publicados
        if: needs.preparar.outputs.resultado_descarga == 'failure'
        run: |
          echo "Se publicó la web, pero falló la descarga de algún país. Se conservaron sus datos anteriores."
          exit 1
